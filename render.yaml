# Render Blueprint — פריסה אוטומטית של "כתיבה בקליק"
# מדריך מלא: DEPLOY.md

# מסד נתונים מנוהל (PostgreSQL) — הנתונים נשמרים לצמיתות
databases:
  - name: clickwriting-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: clickwriting
    runtime: node
    plan: free
    region: frankfurt          # הקרוב ביותר לישראל
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true           # פריסה מחדש אוטומטית בכל push
    envVars:
      - key: DATABASE_URL       # מחובר אוטומטית ל-Postgres שהוגדר למעלה
        fromDatabase:
          name: clickwriting-db
          property: connectionString
      - key: NODE_VERSION
        value: "22.22.2"
      - key: SESSION_SECRET
        generateValue: true    # Render יג'נרט סוד אקראי ומאובטח
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false            # תגדיר סיסמה בדשבורד של Render (לא נשמרת בקוד)
      # ── התראות (אופציונלי) — הסר הערה והגדר בדשבורד לפי הצורך ──
      # - key: WHATSAPP_PHONE
      #   sync: false
      # - key: CALLMEBOT_APIKEY
      #   sync: false
      # - key: NOTIFY_WEBHOOK_URL
      #   sync: false
